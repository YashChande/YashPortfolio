<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Arcade</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Outfit and Orbitron fonts for a modern sci-fi arcade look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="950" height="780"></canvas>

        <!-- Start Screen Overlay -->
        <div id="startScreen" class="overlay active">
            <div class="glass-panel start-panel">
                <div class="start-single-col">
                    <h1 class="glow-text">SPACE SHOOTER</h1>
                    
                    <div class="name-entry-container">
                        <label for="playerNameInput" class="name-input-label">Enter Pilot Name</label>
                        <input type="text" id="playerNameInput" placeholder="PILOT NAME" maxlength="10" class="name-input">
                    </div>
                    
                    <button id="startButton" class="btn btn-primary">Launch</button>
                    
                    <div class="controls-guide">
                        <h3>CONTROLS</h3>
                        <div class="control-row">
                            <span class="key-group">
                                <span class="key">▲</span><span class="key">◄</span><span class="key">▼</span><span class="key">►</span> 
                            </span>
                            <span class="or">OR</span> 
                            <span class="key-group">
                                <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
                            </span>
                            <span class="action">Move Ship</span>
                        </div>
                        <div class="control-row">
                            <span class="key space-key">SPACEBAR</span>
                            <span class="action">Fire Lasers</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="gameOverScreen" class="overlay">
            <div class="glass-panel warning-border game-over-panel">
                <div class="overlay-grid">
                    <!-- Left Column: Game Over Stats -->
                    <div class="grid-col-left">
                        <h1 class="glow-text error-text">GAME OVER</h1>
                        <div class="stats-card">
                            <p class="stats-summary">Ship Crashed at level <span id="finalLevel" class="highlight-text">1</span></p>
                            <div class="score-summary-row">
                                <span>FINAL SCORE:</span> <span id="finalScore" class="score-highlight">0</span>
                            </div>
                        </div>
                        
                        <button id="restartButton" class="btn btn-danger">Play Again</button>
                    </div>
                    
                    <!-- Right Column: Leaderboard -->
                    <div class="grid-col-right">
                        <div class="leaderboard-container">
                            <h2 class="leaderboard-title">TOP PILOTS</h2>
                            <div class="leaderboard-list-wrapper">
                                <ol id="gameOverLeaderboardList" class="leaderboard-list"></ol>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Background Music -->
        <audio id="bgMusic" src="assets/da-da-da.mp3" loop></audio>

        <!-- Volume Group: Mute/Sound Toggle + Volume Slider on hover -->
        <div class="volume-group" id="volumeGroup">
            <button id="soundToggle" class="sound-toggle" aria-label="Toggle Sound">
                <span id="soundOnIcon">🔊</span>
                <span id="soundOffIcon" class="hidden">🔇</span>
            </button>
            <div class="volume-slider-wrapper" id="volumeSliderWrapper">
                <span class="vol-label">VOL</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80">
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <button id="mobileFireButton" class="mobile-fire-btn" aria-label="Fire Lasers">FIRE</button>
    </div>

    <footer class="game-footer">
        Developed by Yash Chande. 2021.
    </footer>

    <script src="game.js"></script>
</body>
</html>
