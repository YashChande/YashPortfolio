<section class="about-section" id="about">
  <div class="container">
    <h2 class="section-title">Background</h2>
    
    <div class="about-grid">
      <div class="about-content">

        <div class="education-timeline" style="margin-top: 2rem;">
            <div class="timeline">
              <div class="timeline-line"></div>
              <div class="timeline-item" *ngFor="let edu of education">
                <div class="timeline-dot"></div>
                <div class="edu-card glass-card">
                  <div class="edu-header">
                    <div class="edu-brand">
                      <img *ngIf="edu.logo" [src]="edu.logo" [alt]="edu.school + ' Logo'" class="edu-logo">
                      <div>
                        <h4 class="edu-degree">{{ edu.degree }}</h4>
                        <p class="edu-school">{{ edu.school }}</p>
                      </div>
                    </div>
                    <span class="edu-period" *ngIf="edu.period">{{ edu.period }}</span>
                  </div>
                  <p class="edu-details">{{ edu.details }}</p>
                </div>
              </div>
            </div>
          </div>
      </div>

      <div class="about-languages glass-card">
        <h3 class="sub-title">Language Proficiency</h3>
        <div class="lang-item">
          <span class="lang-name">Marathi</span>
          <span class="lang-level">Native</span>
        </div>
        <div class="lang-item">
          <span class="lang-name">English</span>
          <div class="lang-bars">
            <span class="lang-bar active">C1</span>
            <span class="lang-desc">Listening, Reading, Writing, Speaking</span>
          </div>
        </div>
        <div class="lang-item">
          <span class="lang-name">Hindi</span>
          <div class="lang-bars">
            <span class="lang-bar active">C1</span>
            <span class="lang-desc">Listening, Reading, Writing, Speaking</span>
          </div>
        </div>
        <div class="lang-item">
          <span class="lang-name">German</span>
          <div class="lang-bars">
            <span class="lang-bar active">A2</span>
            <span class="lang-desc">Ongoing Studies</span>
          </div>
        </div>
        <div class="lang-item">
          <span class="lang-name">French</span>
          <div class="lang-bars">
            <span class="lang-bar active">A2</span>
            <span class="lang-desc">High school</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
