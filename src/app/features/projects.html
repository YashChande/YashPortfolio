<section class="projects-section" id="projects" #projectsSection>
  <div class="projects-scroll-wrapper" #scrollWrapper>
    <div class="container">
      <h2 class="section-title">Projects</h2>
    </div>

    <div class="projects-track" #projectsTrack>
      <div class="project-card glass-card" *ngFor="let project of projects" [id]="project.isGame ? 'space-shooter-card' : ''">
        <div class="project-image-container">
          <img [src]="project.image" [alt]="project.title" class="project-image">
          <div class="project-overlay" *ngIf="project.buttonLabel">
            <ng-container *ngIf="project.isGame; else standardLink">
              <button (click)="playGame()" class="view-project">{{ project.buttonLabel }}</button>
            </ng-container>
            <ng-template #standardLink>
              <ng-container *ngIf="project.isMaintenance; else normalExternal">
                <button (click)="showMaintenanceToast()" class="view-project">{{ project.buttonLabel }}</button>
              </ng-container>
              <ng-template #normalExternal>
                <a [href]="project.link" target="_blank" class="view-project">{{ project.buttonLabel }}</a>
              </ng-template>
            </ng-template>
          </div>
        </div>

        <div class="project-info">
          <div class="project-meta">
            <span class="project-category">{{ project.category }}</span>
            <span class="project-date" *ngIf="project.date">{{ project.date }}</span>
          </div>
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-description">{{ project.description }}</p>

          <div class="project-tags">
            <span class="tag" *ngFor="let tag of project.tags">{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="certifications-section" id="certifications">
      <h2 class="section-title">Honours &amp; Certifications</h2>
      <div class="certs-grid">
        <div class="cert-card glass-card" *ngFor="let cert of certifications">
          <div class="cert-icon">
            <img *ngIf="cert.logo" [src]="cert.logo" [alt]="cert.issuer + ' Logo'" class="sih-icon">
            <span *ngIf="!cert.logo" class="cert-icon-placeholder">🎓</span>
          </div>
          <div class="cert-info">
            <h4>{{ cert.title }}</h4>
            <p>{{ cert.issuer }} • {{ cert.date }}</p>
            <a [href]="cert.link" target="_blank" class="cert-link">View Certificate</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast-error" [class.show]="showToast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="toast-icon">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="16" r="1" fill="currentColor"/>
    </svg>
    <span>{{ toastMessage }}</span>
  </div>
</section>
