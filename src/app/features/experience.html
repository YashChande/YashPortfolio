<section class="experience-section" id="experience">
  <div class="container">
    <h2 class="section-title">Professional Journey</h2>
    
    <div class="timeline">
      <div class="timeline-line"></div>
      
      <div class="timeline-item" *ngFor="let exp of experiences">
        <div class="timeline-dot"></div>
        <div class="experience-card glass-card">
          <div class="exp-header">
            <div class="exp-brand">
              <img *ngIf="exp.logo" [src]="exp.logo" [alt]="exp.company + ' Logo'" class="exp-logo">
              <div>
                <h3 class="exp-title">{{ exp.title }}</h3>
                <h4 class="exp-company">{{ exp.company }}</h4>
              </div>
            </div>
            <span class="exp-period">{{ exp.period }}</span>
          </div>
          
          <p class="exp-desc">{{ exp.description }}</p>
          
          <div class="exp-highlights">
            <span class="highlight-tag" *ngFor="let h of exp.highlights">{{ h }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
