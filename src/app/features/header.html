<header [class.scrolled]="isScrolled" [class.menu-open]="mobileMenuOpen">
  <nav class="container nav-container">
    <div class="logo" (click)="scrollTo('#hero')">
      <span class="logo-text">YC</span>
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15V17M6 10V8C6 4.68629 8.68629 2 12 2C15.3137 2 18 4.68629 18 8V10M6 10H18C19.1046 10 20 10.8954 20 12V20C20 21.1046 19.1046 22 18 22H6C4.89543 22 4 21.1046 4 20V12C4 10.8954 4.89543 10 6 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <ul class="nav-links">
      <li *ngFor="let item of navItems">
        <a (click)="scrollTo(item.id)">{{ item.label }}</a>
      </li>
    </ul>

    <div class="nav-cta">
      <button class="btn-interactive-mode" (click)="toggleInteractiveMode()" title="Launch 2D Game World">
        <span class="game-icon">🎮</span>
        <span class="game-label"><span class="label-full">Interactive Mode</span><span class="label-short">Mode</span></span>
      </button>

      <a [href]="resumeUrl" target="_blank" rel="noopener" class="btn-resume" title="View Resume">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="10,9 9,9 8,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Resume</span>
      </a>

      <!-- Hamburger toggle button -->
      <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" [class.active]="mobileMenuOpen" aria-label="Toggle navigation menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Drawer Menu overlay -->
  <div class="mobile-drawer" [class.open]="mobileMenuOpen">
    <ul class="mobile-nav-links">
      <li *ngFor="let item of navItems">
        <a (click)="scrollTo(item.id)">{{ item.label }}</a>
      </li>
      <li>
        <button class="btn-interactive-mode mobile-btn" (click)="toggleInteractiveMode()">
          <span>🎮 Interactive Mode</span>
        </button>
      </li>
    </ul>
  </div>
</header>
