<section class="contact-section" id="contact">
  <div class="container">
    <div class="contact-header">
      <h2 class="section-title">Get In Touch</h2>
      <p class="section-subtitle">Have a project in mind or just want to connect? Feel free to reach out!</p>
    </div>

    <div class="contact-grid">
      <div class="contact-info">
        <div class="info-card glass-card">
          <h3 class="card-title">Contact Information</h3>
          
          <div class="info-item">
            <span class="icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 7.00005L10.2 11.65C11.2667 12.45 12.7333 12.45 13.8 11.65L20 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <div class="details">
              <span class="label">Email</span>
              <a href="mailto:yashchande3@gmail.com">yashchande3@gmail.com</a>
            </div>
          </div>

          <div class="info-item">
            <span class="icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 16.92V19.92C22 20.4723 21.5523 20.92 21 20.92C10.5066 20.92 2 12.4134 2 1.92C2 1.36772 2.44772 0.919998 3 0.919998H6C6.51283 0.919998 6.9429 1.30526 6.99308 1.81591C7.05942 2.49089 7.21731 3.14912 7.46114 3.77443C7.62534 4.19565 7.51908 4.6751 7.19472 4.99946L5.61746 6.57672C7.30605 9.87327 9.99222 12.5594 13.2888 14.248L14.866 12.6708C15.1904 12.3464 15.6698 12.2401 16.091 12.4043C16.7163 12.6482 17.3746 12.806 18.0495 12.8724C18.5602 12.9226 18.9454 13.3526 18.9454 13.8655V16.92C18.9454 17.4723 19.3932 17.92 19.9454 17.92H22V16.92Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <div class="details phone-details-wrapper">
              <span class="label">Phone</span>
              <span class="phone-link" (click)="dialPhone()">(+49) <span [class.blurred-number]="!phoneRevealed">15510223902</span></span>
              <!-- Floating hint popup on hover -->
              <div class="phone-hint-popup" *ngIf="!phoneRevealed">
                <span class="hint-text">Beat my highscore in my PyGame to reveal it</span>
                <button class="go-to-game-btn" (click)="goToGame($event)" title="Go to Space Shooter">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"/>
                    <polyline points="7 7 17 7 17 17"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="social-links">
            <a href="https://linkedin.com/in/yashchande" target="_blank" class="social-icon" aria-label="LinkedIn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
              </svg>
            </a>
            <a href="https://github.com/YashChande" target="_blank" class="social-icon" aria-label="GitHub">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </a>
            <a href="https://www.instagram.com/yash.chande/" target="_blank" class="social-icon" aria-label="Instagram">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>

      <div class="contact-form-container">
        <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-grid">
            <div class="form-group">
              <input type="text" id="name" name="name" [(ngModel)]="formData.name" placeholder="Your Name" required>
            </div>
            <div class="form-group">
              <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="Your Email" required>
            </div>
          </div>
          <div class="form-group">
            <input type="text" id="subject" name="subject" [(ngModel)]="formData.subject" placeholder="Subject" required>
          </div>
          <div class="form-group">
            <textarea id="message" name="message" [(ngModel)]="formData.message" rows="5" placeholder="Your Message" required></textarea>
          </div>

          <!-- Status Messages -->
          <div class="status-message" *ngIf="status.message" [ngClass]="{'success': status.success, 'error': status.error}">
            {{ status.message }}
          </div>

          <button type="submit" class="submit-btn" [disabled]="status.submitting || !contactForm.valid">
            <span *ngIf="!status.submitting">Send Message</span>
            <span *ngIf="status.submitting">Sending...</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast notification for contact -->
  <div class="toast-error" [class.show]="showToast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="toast-icon">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="16" r="1" fill="currentColor"/>
    </svg>
    <span>{{ toastMessage }}</span>
  </div>
</section>
