<section class="contact-section" id="contact">
  <div class="container">
    <div class="contact-header">
      <h2 class="section-title">Get In Touch</h2>
      <p class="section-subtitle">Have a project in mind or just want to say hi? Feel free to reach out!</p>
    </div>

    <div class="contact-grid">
      <div class="contact-info">
        <div class="info-card glass-card">
          <h3 class="card-title">Contact Information</h3>
          
          <div class="info-item">
            <span class="icon"></span>
            <div class="details">
              <span class="label">Email</span>
              <a href="mailto:yashchande3@gmail.com">yashchande3@gmail.com</a>
            </div>
          </div>

          <div class="info-item">
            <span class="icon"></span>
            <div class="details">
              <span class="label">Phone</span>
              <a href="tel:+4915510223902">(+49) 15510223902</a>
            </div>
          </div>

          <div class="social-links">
            <a href="https://linkedin.com/in/yashchande" target="_blank" class="social-icon" aria-label="LinkedIn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
              </svg>
            </a>
            <a href="https://github.com/YashChande" target="_blank" class="social-icon" aria-label="GitHub">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>

      <div class="contact-form-container">
        <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-grid">
            <div class="form-group">
              <input type="text" id="name" name="name" [(ngModel)]="formData.name" placeholder="Your Name" required>
            </div>
            <div class="form-group">
              <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="Your Email" required>
            </div>
          </div>
          <div class="form-group">
            <input type="text" id="subject" name="subject" [(ngModel)]="formData.subject" placeholder="Subject" required>
          </div>
          <div class="form-group">
            <textarea id="message" name="message" [(ngModel)]="formData.message" rows="5" placeholder="Your Message" required></textarea>
          </div>

          <!-- Status Messages -->
          <div class="status-message" *ngIf="status.message" [ngClass]="{'success': status.success, 'error': status.error}">
            {{ status.message }}
          </div>

          <button type="submit" class="submit-btn" [disabled]="status.submitting || !contactForm.valid">
            <span *ngIf="!status.submitting">Send Message</span>
            <span *ngIf="status.submitting">Sending...</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
