<div class="custom-cursor">
  <div class="cursor-arrow">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4L20 12L4 20L8 12L4 4Z" fill="currentColor"/>
    </svg>
  </div>
</div>

<div class="bg-fixed">
  <div #bgContainer class="bg-canvas"></div>
  <div class="bg-glows">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>
</div>

<app-game-world></app-game-world>

<app-header></app-header>

<main>
  <app-hero id="hero"></app-hero>
  <app-about id="about"></app-about>
  <app-skills id="skills"></app-skills>
  <app-experience id="experience"></app-experience>
  <app-projects id="projects"></app-projects>
  <app-contact id="contact"></app-contact>
</main>

<app-footer></app-footer>

<!-- ☁️ CLASH OF CLANS DYNAMIC CLOUD TRANSITION OVERLAY ☁️ -->
<div class="coc-cloud-overlay"
     [class.covering]="gameWorldService.cloudState() === 'covering'"
     [class.uncovering]="gameWorldService.cloudState() === 'uncovering'"
     *ngIf="gameWorldService.cloudState() !== 'idle'">
  
  <!-- Left Cloud Mass -->
  <div class="cloud-curtain curtain-left">
    <div class="curtain-base"></div>
    <div class="cloud-puff-group">
      <div class="cloud-puff puff-l1"></div>
      <div class="cloud-puff puff-l2"></div>
      <div class="cloud-puff puff-l3"></div>
      <div class="cloud-puff puff-l4"></div>
      <div class="cloud-puff puff-l5"></div>
      <div class="cloud-puff puff-l6"></div>
      <div class="cloud-puff puff-l7"></div>
    </div>
  </div>

  <!-- Right Cloud Mass -->
  <div class="cloud-curtain curtain-right">
    <div class="curtain-base"></div>
    <div class="cloud-puff-group">
      <div class="cloud-puff puff-r1"></div>
      <div class="cloud-puff puff-r2"></div>
      <div class="cloud-puff puff-r3"></div>
      <div class="cloud-puff puff-r4"></div>
      <div class="cloud-puff puff-r5"></div>
      <div class="cloud-puff puff-r6"></div>
      <div class="cloud-puff puff-r7"></div>
    </div>
  </div>
</div>

<div class="game-modal" *ngIf="gameService.isActive$ | async">
  <div class="game-modal-overlay" (click)="gameService.close()"></div>
  
  <!-- Orientation Notice for mobile portrait -->
  <div class="orientation-notice" *ngIf="isPortraitMobile">
    <div class="notice-card">
      <div class="phone-icon-animation">🔄</div>
      <h3>Rotate Device</h3>
      <p>Please rotate your device to landscape mode to play Space Shooter!</p>
      <button class="btn" (click)="gameService.close()">Close Game</button>
    </div>
  </div>

  <div class="game-modal-container" [ngStyle]="gameContainerStyle" *ngIf="!isPortraitMobile">
    <iframe src="space-shooter/index.html" class="game-iframe" [ngStyle]="gameIframeStyle"></iframe>
    <button class="close-btn" (click)="gameService.close()" aria-label="Close Game" [ngStyle]="{ transform: 'scale(' + gameScale + ') translate(-20px, -20px)', 'transform-origin': 'bottom right' }">&times;</button>
  </div>
</div>
